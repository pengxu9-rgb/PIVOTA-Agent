description: MCP caller-limit in-flight slots past their max age (flagged zombies; still counted until their work ends).
filter: >-
  resource.type="cloud_run_revision"
  resource.labels.service_name="gateway"
  jsonPayload.event="mcp_caller_limit_reaped"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: door
      valueType: STRING
    - key: tier
      valueType: STRING
labelExtractors:
  door: EXTRACT(jsonPayload.door)
  tier: EXTRACT(jsonPayload.tier)
