description: MCP caller-limit shared store, daily salt, or shared snapshot unavailable/stale (limits fall back to per-instance shares).
filter: >-
  resource.type="cloud_run_revision"
  resource.labels.service_name="gateway"
  (jsonPayload.event="mcp_caller_limit_store" OR jsonPayload.event="mcp_caller_limit_salt" OR jsonPayload.event="mcp_caller_limit_stale")
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: event
      valueType: STRING
    - key: code
      valueType: STRING
labelExtractors:
  event: EXTRACT(jsonPayload.event)
  code: EXTRACT(jsonPayload.code)
