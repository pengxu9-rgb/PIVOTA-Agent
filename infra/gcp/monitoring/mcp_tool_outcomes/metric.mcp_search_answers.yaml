# Log-based counter: search_catalog answers that carried a result list (result_count present, any value).
# Denominator of the zero-result-rate alert. A tool error carries no result_count and is not counted here.
#   gcloud logging metrics create mcp_search_answers --project=$PROJECT \
#     --config-from-file=infra/gcp/monitoring/mcp_tool_outcomes/metric.mcp_search_answers.yaml
description: MCP search_catalog answers with a result list, by door / tier
filter: >-
  resource.type="cloud_run_revision"
  AND jsonPayload.msg="mcp tools/call complete"
  AND jsonPayload.outcome:*
  AND jsonPayload.tool="search_catalog"
  AND jsonPayload.result_count>=0
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: door
      valueType: STRING
    - key: tier
      valueType: STRING
labelExtractors:
  door: EXTRACT(jsonPayload.door)
  tier: EXTRACT(jsonPayload.tier)
