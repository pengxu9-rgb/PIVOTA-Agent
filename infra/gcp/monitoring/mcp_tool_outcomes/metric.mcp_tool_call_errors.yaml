# Log-based counter: answered MCP tools/calls that failed (tool error, JSON-RPC error, internal error). These all
# answer HTTP 200 on the wire, so no 5xx metric sees them. Numerator of the tool error-rate alert.
#   gcloud logging metrics create mcp_tool_call_errors --project=$PROJECT \
#     --config-from-file=infra/gcp/monitoring/mcp_tool_outcomes/metric.mcp_tool_call_errors.yaml
description: MCP tools/call completions that failed, by tool / door / tier / error_code (refused excluded)
filter: >-
  resource.type="cloud_run_revision"
  AND jsonPayload.msg="mcp tools/call complete"
  AND jsonPayload.outcome:*
  AND jsonPayload.is_error=true
  AND jsonPayload.outcome!="refused"
metricDescriptor:
  metricKind: DELTA
  valueType: INT64
  unit: "1"
  labels:
    - key: tool
      valueType: STRING
    - key: door
      valueType: STRING
    - key: tier
      valueType: STRING
    - key: error_code
      valueType: STRING
labelExtractors:
  tool: EXTRACT(jsonPayload.tool)
  door: EXTRACT(jsonPayload.door)
  tier: EXTRACT(jsonPayload.tier)
  error_code: EXTRACT(jsonPayload.error_code)
