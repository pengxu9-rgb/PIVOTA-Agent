name: Catalog Serving Index Backfill

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Optional brand filter"
        required: false
        default: ""
        type: string
      market:
        description: "Market"
        required: true
        default: "US"
        type: string
      limit:
        description: "Row limit"
        required: true
        default: "500"
        type: string
      dry_run:
        description: "Dry-run only"
        required: true
        default: true
        type: boolean
      refresh:
        description: "Refresh existing docs"
        required: true
        default: true
        type: boolean
      public_only:
        description: "Only public docs"
        required: true
        default: true
        type: boolean

jobs:
  backfill-catalog-serving-index:
    runs-on: ubuntu-latest
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CATALOG_SERVING_BASE_URL: ${{ vars.CATALOG_SERVING_BASE_URL || secrets.CATALOG_SERVING_BASE_URL }}
      CATALOG_SERVING_INDEX_BASE_URL: ${{ vars.CATALOG_SERVING_INDEX_BASE_URL || secrets.CATALOG_SERVING_INDEX_BASE_URL || vars.CATALOG_SERVING_BASE_URL || secrets.CATALOG_SERVING_BASE_URL }}
      CATALOG_SERVING_INDEX_NAME: ${{ vars.CATALOG_SERVING_INDEX_NAME || secrets.CATALOG_SERVING_INDEX_NAME || 'catalog_public_v1' }}
      CATALOG_SERVING_API_KEY: ${{ secrets.CATALOG_SERVING_API_KEY }}
      CATALOG_SERVING_INDEX_API_KEY: ${{ secrets.CATALOG_SERVING_INDEX_API_KEY || secrets.CATALOG_SERVING_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Backfill catalog serving index
        shell: bash
        run: |
          set -euo pipefail
          out_dir="reports/workflow_ops/catalog-serving-index-backfill/${{ github.run_id }}"
          result_path="${out_dir}/result.json"
          mkdir -p "${out_dir}"
          brand='${{ inputs.brand }}'
          export BRAND="${brand}"
          export MARKET="${{ inputs.market }}"
          export PUBLIC_ONLY="${{ inputs.public_only }}"
          if [[ '${{ inputs.dry_run }}' != 'true' && -z "${CATALOG_SERVING_INDEX_BASE_URL:-}" && -z "${CATALOG_SERVING_BASE_URL:-}" ]]; then
            node -e 'const fs=require("fs"); const out=process.argv[1]; fs.writeFileSync(out, `${JSON.stringify({ok:false,error:"CATALOG_SERVING_INDEX_DISABLED",message:"CATALOG_SERVING_INDEX_BASE_URL or CATALOG_SERVING_BASE_URL must be configured for non-dry-run catalog serving backfill.",requested:{brand:process.env.BRAND||"",market:process.env.MARKET||"US",dry_run:false,public_only:process.env.PUBLIC_ONLY==="true"},index:{enabled:false,base_url:null,index_name:process.env.CATALOG_SERVING_INDEX_NAME||"catalog_public_v1"}}, null, 2)}\n`);' "${result_path}"
            cat "${result_path}"
            exit 1
          fi
          args=(
            --market "${{ inputs.market }}"
            --limit "${{ inputs.limit }}"
          )
          if [[ -n "${brand}" ]]; then
            args+=(--brand "${brand}")
          fi
          if [[ '${{ inputs.dry_run }}' == 'true' ]]; then
            args+=(--dry-run)
          fi
          if [[ '${{ inputs.refresh }}' == 'true' ]]; then
            args+=(--refresh)
          fi
          if [[ '${{ inputs.public_only }}' == 'true' ]]; then
            args+=(--public-only)
          fi
          node scripts/backfill-catalog-serving-index.js "${args[@]}" \
            | tee "${result_path}"
          node - "${result_path}" <<'NODE'
          const fs = require('fs');
          const resultPath = process.argv[2];
          const payload = JSON.parse(fs.readFileSync(resultPath, 'utf8'));
          const dryRun = payload?.requested?.dry_run === true;
          const indexed = Number(payload?.result?.indexed || 0);
          const docsBuilt = Number(payload?.result?.docs_built || 0);
          const source = String(payload?.result?.source || '');
          if (!dryRun && (source === 'disabled' || indexed < docsBuilt)) {
            console.error(JSON.stringify({
              error: 'CATALOG_SERVING_INDEX_BACKFILL_INCOMPLETE',
              source,
              indexed,
              docs_built: docsBuilt,
            }));
            process.exit(1);
          }
          NODE

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-serving-index-backfill-${{ github.run_id }}
          path: reports/workflow_ops/catalog-serving-index-backfill/${{ github.run_id }}
          retention-days: 7
