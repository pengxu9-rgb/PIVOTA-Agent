# Promote a build to the RAILWAY production app and verify it came up.
#
# THIS DOES NOT DEPLOY THE PRODUCTION GATEWAY. Since the 2026-08-22 cutover the gateway that serves
# real traffic is Cloud Run behind gateway.pivota.cc, deployed by hand with deploy_gateway.sh. This
# workflow only ever talked to `pivota-agent-production.up.railway.app`, which still auto-deploys
# from GitHub and is no longer the production surface.
#
# WHY THE `push` TRIGGER IS GONE. On every merge to main this ran, watched Railway pick the commit
# up on its own, and reported a green "Production Deploy Promote" - while the Cloud Run gateway
# stayed exactly where it was. #2097 merged at 06:33Z on 2026-08-25 and this job went green at
# 06:35Z; the gateway did not get that commit until a hand deploy about eight hours later. The
# `gateway prod drift` alarm was correct throughout, and correctly quiet at first: it holds a
# 120-minute grace window, so it stayed green until 09:10Z and was then red until the deploy. For
# those five-plus hours the two jobs disagreed about the same commit and only the red one was
# true. A verification aimed at a host nobody serves from does not weaken into a partial check -
# it becomes a claim that the deploy happened.
#
# That is the same failure `gateway-prod-drift.yml` was written to end, and its own header records
# the previous instance: `production-deploy-drift-guard.yml` watched a Vercel 404 and a Railway URL
# until it was switched off in June. Two workflows disagreeing about production is worse than one
# reporting it, so the answer to `push` is to remove it rather than repoint it - `gateway prod
# drift` already measures the real gateway on merge and hourly, and it is the single source of
# truth for whether production runs main.
#
# `workflow_dispatch` stays: promoting to Railway on purpose is still a thing an operator may want,
# and run by hand it makes no claim about the gateway.
name: Production Deploy Promote

on:
  workflow_dispatch: {}

concurrency:
  group: production-deploy-promote
  cancel-in-progress: true

jobs:
  trigger-production-deploy:
    name: Trigger Production Deploy From GitHub Main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Gateway caller auth (#2038); absent -> header omitted, today's behaviour.
      AURORA_SURFACE_INTERNAL_KEY: ${{ secrets.AURORA_SURFACE_INTERNAL_KEY }}
      PROD_DEPLOY_WEBHOOK_URL: ${{ secrets.RAILWAY_PRODUCTION_DEPLOY_WEBHOOK_URL || secrets.PIVOTA_AGENT_PROD_DEPLOY_WEBHOOK_URL || secrets.RAILWAY_DEPLOY_WEBHOOK_URL || '' }}
      PROD_SMOKE_BASE_URL: ${{ vars.PIVOTA_AGENT_PROD_INVOKE_BASE_URL || vars.COMMERCE_CORE_PROD_SMOKE_BASE_URL || 'https://pivota-agent-production.up.railway.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Detect production deploy owner
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${PROD_DEPLOY_WEBHOOK_URL}" ]]; then
            echo "::notice::No explicit production deploy trigger configured. Falling back to direct GitHub-linked production deploy detection."
          else
            echo "Production deploy webhook configured."
          fi

      - name: Trigger production deploy webhook
        if: env.PROD_DEPLOY_WEBHOOK_URL != ''
        shell: bash
        env:
          DEPLOY_WEBHOOK_URL: ${{ env.PROD_DEPLOY_WEBHOOK_URL }}
          DEPLOY_REASON: github_push_main_promote
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TRIGGER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRIGGER_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          bash scripts/trigger_deploy_webhook.sh

      - name: Verify deployed commit via /version
        shell: bash
        run: |
          set -euo pipefail
          INVOKE_BASE_URL="$PROD_SMOKE_BASE_URL" \
          TARGET_COMMIT="${GITHUB_SHA:0:12}" \
          MAX_ATTEMPTS=72 \
          SLEEP_SECONDS=10 \
          bash scripts/verify_deployed_commit_matches.sh

      - name: Photo backend contract canary
        id: photo_backend_contract_canary
        continue-on-error: true
        shell: bash
        env:
          BASE: ${{ env.PROD_SMOKE_BASE_URL }}
          BACKEND_BASE: ${{ vars.PIVOTA_BACKEND_PUBLIC_BASE_URL || 'https://web-production-fedb.up.railway.app' }}
          AGENT_API_KEY: ${{ secrets.COMMERCE_CORE_PROD_AGENT_API_KEY || secrets.PIVOTA_AGENT_PROD_AGENT_API_KEY || secrets.PIVOTA_PRODUCTION_AGENT_API_KEY || secrets.PROD_AGENT_API_KEY || secrets.AGENT_API_KEY || '' }}
          LANG_HEADER: CN
        run: |
          set -euo pipefail
          npm run probe:photo-contract:prod -- --timeout-ms 180000

      - name: Report photo backend canary drift
        if: steps.photo_backend_contract_canary.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning::Photo backend contract canary failed after deploy verification. Production deploy stayed promoted; investigate scripts/photo_backend_contract_canary.cjs and backend /photos upstream separately."
