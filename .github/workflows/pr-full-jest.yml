  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        # npm ci runs onnxruntime-node's postinstall, which downloads a native
        # binary from a CDN that intermittently ETIMEDOUTs and fails the whole
        # shard before any test runs. Retry a few times to ride out the flake.
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Run jest shard ${{ matrix.shard }}/8
        # One worker (NOT --runInBand): --workerIdleMemoryLimit recycles it
        # between files so heap can't accumulate to the OOM-abort that killed
        # --runInBand on the heaviest shard. maxWorkers=1 (not 2) gives the
        # single worker the whole runner: with 2 workers, budget-timed resolver
        # tests in aurora_bff_product_intel.test.js lost the CPU race under
        # node-20 contention and bailed to the wrong branch (green locally,
        # red in CI). Parallelism still comes from the 8-way shard matrix.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx jest \
            --watchman=false \
            --silent \
            --maxWorkers=1 \
            --workerIdleMemoryLimit=768MB \
            --shard=${{ matrix.shard }}/8
