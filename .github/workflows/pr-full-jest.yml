      # ADDED 2026-08-13: the three UCP-dialect suites, confirmed green before
      # landing (`ucpToolVocabulary` 9, `ucpDialectSurface` 9, `ucpArgumentAdapter`
      # 43 — 61 together). The first two shipped with #1962 and ran in NO workflow
      # at all — the third instance of that on this list — so the dialect's contract was
