name: PR Full Jest Gate

# Runs the ENTIRE jest suite (everything jest --listTests discovers) on every
# PR, sharded across parallel runners with jest's native --shard. This is the
# backstop gate: the older per-area workflows run hand-picked allowlists, so
# suites outside those lists used to rot silently (31 suites / 134 tests had
# accumulated red by 2026-07-11 before this gate existed).
#
# Env-dependent or retired suites must NOT be excluded here via allowlists —
# gate them inside the test file (env opt-in describe.skip, see
# tests/look_replicate_orchestration.test.js) or quarantine by renaming off
# the *.test.js pattern, so the exclusion is visible in the tree.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      # ANY workflow change, not just this file's. The workflow-hygiene gate in
      # tests/ polices `.github/workflows/**`, and a PR that ADDS a workflow
      # touches nothing else — so without this the gate could not fire on the
      # exact change class it exists to police. That is how the backend's twin
      # gate shipped unable to run; do not narrow this back.
      - ".github/workflows/**"
  workflow_dispatch: {}

concurrency:
  group: pr-full-jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE SUITES JEST STRUCTURALLY CANNOT SEE. jest.config.js testMatch is
  # `**/tests/**/*.test.(js|ts)`, so every `*.node.test.cjs` file is invisible to
  # the shard matrix below — including tests written specifically to pin
  # behaviour that had already broken production once. #1829's
  # `commerce_kernel_error_body` has never run in CI; #1837's
  # `commerce_kernel_error_mapping` would have joined it.
  #
  # DELIBERATELY A SHORT ALLOWLIST, which the header above rightly forbids for
  # jest. The repo has ~45 `.node.test.cjs` files listed in `npm run test:node`
  # and no workflow runs any of them; sweeping them all in here without first
  # confirming each is green would trade a silent gap for a permanently red gate.
  # This starts with the shared error taxonomy — the money-path classification —
  # and should grow file by file as each is confirmed.
  node-tests:
    name: node:test (allowlist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` IS required, and the reason is worth writing down because it is
      # easy to get wrong locally. `node_modules` is a TRACKED SYMLINK in this
      # repo pointing at an absolute path on a developer machine, so every fresh
      # checkout — including this runner and `git archive` — starts with a
      # DANGLING link. On a dev box it silently resolves to a populated tree, so
      # "this test needs no deps" verifies as true locally and is false in CI.
      # commerce_kernel_error_body pulls in the axios/pino side of src/; only the
      # mapping test is genuinely dependency-free.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      # ADDED 2026-07-27: the three ACP feed-lane suites. Jest's testMatch is
      # `**/tests/**/*.test.(js|ts)`, so `*.node.test.cjs` is STRUCTURALLY
      # invisible to the sharded jest job below — landing them without this
      # entry would mean the only tests for the feed's flag gates, price gate and
      # rig exclusion run in no CI job at all. In a repo that has shipped "a test
      # that cannot fail" four times in three days, that is the same wound.
      # CORRECTION to an earlier version of this comment: these files do NOT run
      # dependency-free. `product_entity_index_feed_election` reaches
      # src/services/productEntityIndexFeed -> ../db -> ../logger and fails with
      # `Cannot find module 'pino'` on a checkout without node_modules. The job
      # is green because `npm ci` runs above, NOT because the files are leaves.
      # Green here proves the job passes; it does not prove the reason. Said
      # plainly so nobody relies on the wrong one.
      #
      # ADDED 2026-07-29: the three suites guarding the PDP-renderability
      # predicate and the public-read chain filter (pdp_renderability,
      # public_read_chain_resolvability, public_read_chain_seed_routed_probe),
      # all confirmed green locally before landing. The per-platform verdict
      # flip in this same change is exactly the event the probe suite exists to
      # catch, and none of the three ran in ANY workflow before this.
      # ADDED 2026-07-28: `acp_feed_flags`, confirmed green (6/6) before landing,
      # per the "grow file by file as each is confirmed" rule above. It was the
      # ONLY suite asserting the invariant that publishing the read-only feed
      # never mounts a money-path endpoint — and it ran in no workflow at all,
      # while the commit alongside this one turns that feed on in production.
      # ADDED 2026-08-01: `ucp_order_webhook_receiver`, confirmed green (18/18)
      # before landing. It is the ONLY suite covering the ported UCP business
      # doors — the /.well-known/ucp kill-switch decoupling, the published
      # business signing keys (private material refused), and the order-webhook
      # detached-JWS verification/dedup — which run in no other workflow.
      # ADDED 2026-08-04: `acp_delegate_payment_refusal`, confirmed green (6/6)
      # before landing. It guards the one gateway path a caller sends a raw PAN
      # and CVC to (ACP delegate_payment, permanently refused): that the refusal
      # answers in every configuration, that neither the PAN nor the CVC reaches
      # the response or any log line, and that the express.json rawBody stash
      # skips that path. Nothing else asserts any of it.
      # ADDED 2026-08-04: `public_read_mcp_heartbeat`, confirmed green (8/8)
      # before landing. It is the ONLY suite covering the edge-timeout guard on
      # the public MCP tier — that slow responses commit 200 + heartbeat bytes
      # (the cold-search dropped-connection fix) and that fast paths stay
      # byte-identical buffered responses. Dependency-free (node builtins + the
      # pure module), but per the npm-ci note above, green proves the job
      # passes, not that the file is a leaf.
      # ADDED 2026-08-04: `commerce_mcp_route_heartbeat`, confirmed green (7/7)
      # before landing. It is the ONLY suite covering the same edge-timeout
      # guard on the AUTHENTICATED commerce /mcp lane: a slow tools/call
      # commits 200 + heartbeat whitespace with a still-parseable JSON-RPC
      # body, while the non-200 fast paths (strict-off 404, missing-key 401)
      # keep their real statuses because they resolve before the heartbeat is
      # created. Boots the real server via supertest, so it needs the npm ci
      # above.
      # ADDED 2026-08-04: `commerce_mcp_heartbeat_gate`, confirmed green (7/7)
      # before landing AND mutation-checked — deleting the tools/call gate
      # fails 2 of its tests, deleting the elapsed-budget subtraction fails a
      # 3rd. It carries the safety property the route suite structurally
      # CANNOT: committing locks the response to 200 forever, so only
      # tools/call may arm the heartbeat (the adapter's 202 for
      # notifications/initialized would otherwise become 200 + an unparseable
      # "\n"). A route test cannot prove that — everything preceding the
      # dispatch is synchronous, so the commit timer never fires there — which
      # is exactly the "test that cannot fail" shape this job exists to avoid.
      # ADDED 2026-08-05: `commerce_search_self_invoke_budget`, confirmed green
      # (6/6) before landing AND mutation-checked — reverting the budget wiring,
      # the `disableTimeoutRetry: selfInvoked` policy, or the `selfInvoked` flag
      # on find_products_multi each fail a test. It guards the cold-search
      # latency fix: the loopback self-call gets its own budget and is attempted
      # ONCE, because a retry re-ran the whole pipeline concurrently and doubled
      # partner latency to ~2x the real work.
      # It ALSO carries the counter-invariant, which matters more than the perf:
      # the canonical-chain await must NOT be raced against a budget. Its name
      # says telemetry, but it applies a strict-empty PRODUCT rescue, so
      # abandoning the wait serves an empty result where products existed. A
      # first cut of this PR did exactly that; the guard test is what stops it
      # coming back. Boots the real server via supertest + nock, so it needs the
      # npm ci above.
      # ADDED 2026-08-05: the first two `mcp-server/test/**` files in ANY CI job.
      # Those suites live under `test/` (singular) while jest's testMatch wants
      # `tests/`, so every one of them has always run in no workflow at all.
      # `commerceReadCache` (13/13, mutation-checked) carries the argument that
      # lets commerce search results be SHARED ACROSS CALLERS: that
      # search_catalog is caller-independent. Its headline test records at the
      # UPSTREAM seam through a real canonical executor, because a stubbed
      # executor would stub out the very layer that can break the property —
      # an earlier draft did exactly that, and the reviewer's leak mutation
      # (passing buyer_ref through the executor's read()) landed GREEN.
      # `commerceToolSurface` (17/17) is added alongside it because it covers
      # the sanitizer/identity behaviour of the same surface and independently
      # catches that leak. Both are ESM (mcp-server sets type:module); node
      # --test handles that next to the .cjs files.
      # ADDED 2026-08-05: `upstream_retry_deadline_budget`, confirmed green
      # (4/4) AND mutation-checked — removing the skip, or the retry-timeout
      # clamp, each fail a test. It guards a rule the find_products_multi
      # mainline broke: never start an upstream attempt the caller's hard
      # deadline will cut off. A 6000ms deadline over a 4500ms attempt gave the
      # retry 1500ms to redo work that had just failed in 4500ms, so its only
      # effects were +1.5s of latency and a second request at an upstream
      # already under stress. Includes a ROUTE-level test that counts upstream
      # attempts in the production shape (attempt timeout under deadline):
      # deleting the one-line call-site wiring makes it see 2 attempts instead
      # of 1. An earlier draft claimed that shape could not be posed in a
      # harness and shipped the gap as a comment; review disproved it, so the
      # claim is gone and the test is here.
      # ADDED 2026-08-05: `fpm_stage_attribution`, confirmed green (2/2) AND
      # mutation-checked — deleting the route_entry stage fails both tests,
      # recording it after context_build fails the ordering one. It guards the
      # search pipeline's own latency telemetry: full-pipeline requests were 99%
      # attributed while EARLY-EXIT requests left 93-99% of their latency with
      # nothing to explain it. Instrumentation that quietly stops firing is
      # indistinguishable from working, so the test reads the log line the
      # server really emits — via a child process, because pino writes through
      # sonic-boom to fd 1 and an in-process stdout patch captures nothing.
      - name: Run node:test suites
        run: |
          node --test \
            tests/commerce_kernel_error_body.node.test.cjs \
            tests/commerce_kernel_error_mapping.node.test.cjs \
            tests/asserted_privilege_observation.node.test.cjs \
            tests/acp_feed_item.node.test.cjs \
            tests/acp_feed_source.node.test.cjs \
            tests/product_entity_index_feed_election.node.test.cjs \
            tests/acp_feed_flags.node.test.cjs \
            tests/acp_feed_pagination.node.test.cjs \
            tests/public_feed_gate.node.test.cjs \
            tests/acp_adapter_applies_mapper.node.test.cjs \
            tests/pdp_renderability.node.test.cjs \
            tests/pdp_identity_coverage_catchup.node.test.cjs \
            tests/caller_identity.node.test.cjs \
            tests/public_read_chain_resolvability.node.test.cjs \
            tests/public_read_chain_seed_routed_probe.node.test.cjs \
            tests/ucp_order_webhook_receiver.node.test.cjs \
            tests/acp_delegate_payment_refusal.node.test.cjs \
            tests/public_read_mcp_heartbeat.node.test.cjs \
            tests/commerce_mcp_route_heartbeat.node.test.cjs \
            tests/commerce_mcp_heartbeat_gate.node.test.cjs \
            tests/commerce_search_self_invoke_budget.node.test.cjs \
            mcp-server/test/commerceReadCache.test.js \
            mcp-server/test/commerceToolSurface.test.js \
            tests/upstream_retry_deadline_budget.node.test.cjs \
            tests/fpm_stage_attribution.node.test.cjs

  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        # npm ci runs onnxruntime-node's postinstall, which downloads a native
        # binary from a CDN that intermittently ETIMEDOUTs and fails the whole
        # shard before any test runs. Retry a few times to ride out the flake.
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Run jest shard ${{ matrix.shard }}/8
        # One worker (NOT --runInBand): --workerIdleMemoryLimit recycles it
        # between files so heap can't accumulate to the OOM-abort that killed
        # --runInBand on the heaviest shard. maxWorkers=1 (not 2) gives the
        # single worker the whole runner: with 2 workers, budget-timed resolver
        # tests in aurora_bff_product_intel.test.js lost the CPU race under
        # node-20 contention and bailed to the wrong branch (green locally,
        # red in CI). Parallelism still comes from the 8-way shard matrix.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx jest \
            --watchman=false \
            --silent \
            --maxWorkers=1 \
            --workerIdleMemoryLimit=768MB \
            --shard=${{ matrix.shard }}/8
