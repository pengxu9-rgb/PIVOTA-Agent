      # (passing buyer_ref through the executor's read()) landed GREEN.
      # `commerceToolSurface` (17/17) is added alongside it because it covers
      # the sanitizer/identity behaviour of the same surface and independently
      # catches that leak. Both are ESM (mcp-server sets type:module); node
      # --test handles that next to the .cjs files.
      # ADDED 2026-08-05: `upstream_retry_deadline_budget`, confirmed green
      # (4/4) AND mutation-checked — removing the skip, or the retry-timeout
      # clamp, each fail a test. It guards a rule the find_products_multi
      # mainline broke: never start an upstream attempt the caller's hard
      # deadline will cut off. A 6000ms deadline over a 4500ms attempt gave the
      # retry 1500ms to redo work that had just failed in 4500ms, so its only
      # effects were +1.5s of latency and a second request at an upstream
      # already under stress. Includes a ROUTE-level test that counts upstream
      # attempts in the production shape (attempt timeout under deadline):
      # deleting the one-line call-site wiring makes it see 2 attempts instead
      # of 1. An earlier draft claimed that shape could not be posed in a
      # harness and shipped the gap as a comment; review disproved it, so the
      # claim is gone and the test is here.
      # ADDED 2026-08-05: `fpm_stage_attribution`, confirmed green (5/5) AND
      # mutation-checked — deleting route_entry fails 3, deleting the beauty
      # lane stage fails 1, renaming fpm_unattributed_ms fails 1, and moving
      # route_entry back BELOW the early beauty lane fails 2 (that ordering is
      # load-bearing: recorded after the lane, route_entry's span CONTAINS it,
      # so fpm_stage_total_ms double-counts a multi-second lane and the
      # attribution gap goes negative — confidently wrong beats missing only in
      # the wrong direction). It guards the
      # search pipeline's own latency telemetry: full-pipeline requests were 99%
      # attributed while EARLY-EXIT requests left 93-99% of their latency with
      # nothing to explain it. Instrumentation that quietly stops firing is
      # indistinguishable from working, so the test reads the log line the
      # server really emits — via a child process, because pino writes through
      # sonic-boom to fd 1 and an in-process stdout patch captures nothing.
      # ADDED 2026-08-04: `integration/agent_checkout_acp_ucp_doors`, confirmed
      # green (8/8) before landing. It already existed and ran in NO workflow —
      # found while adding the ACP door's buyer/address/item intake (PR-E), whose
      # end-to-end proof it now is: the only suite that drives a real signed ACP
      # create through src/server.js's own wiring, and pairs it with a no-email
      # credential that must be REFUSED at intake, so the attested-buyer-email
      # path (verified JWT claim -> resolveUserRef ->
      # quote buyer_context) is exercised outside the kernel's own harness. It is
      # also the only coverage of the ACP/UCP door flag gates and the 405 on the
      # charge endpoint while submit_payment is disabled.
      # ADDED 2026-08-04: `acp_spt_gateway_handoff`, confirmed green (6/6) before
      # landing. It is the only place the delegated-PSP-token (Stripe
      # SharedPaymentToken) money lane is exercised through src/server.js's own
