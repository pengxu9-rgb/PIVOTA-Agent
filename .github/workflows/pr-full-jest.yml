name: PR Full Jest Gate

# Runs the ENTIRE jest suite (everything jest --listTests discovers) on every
# PR, sharded across parallel runners with jest's native --shard. This is the
# backstop gate: the older per-area workflows run hand-picked allowlists, so
# suites outside those lists used to rot silently (31 suites / 134 tests had
# accumulated red by 2026-07-11 before this gate existed).
#
# Env-dependent or retired suites must NOT be excluded here via allowlists —
# gate them inside the test file (env opt-in describe.skip, see
# tests/look_replicate_orchestration.test.js) or quarantine by renaming off
# the *.test.js pattern, so the exclusion is visible in the tree.

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "jest.config.js"
      - ".github/workflows/pr-full-jest.yml"
  workflow_dispatch: {}

concurrency:
  group: pr-full-jest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # THE SUITES JEST STRUCTURALLY CANNOT SEE. jest.config.js testMatch is
  # `**/tests/**/*.test.(js|ts)`, so every `*.node.test.cjs` file is invisible to
  # the shard matrix below — including tests written specifically to pin
  # behaviour that had already broken production once. #1829's
  # `commerce_kernel_error_body` has never run in CI; #1837's
  # `commerce_kernel_error_mapping` would have joined it.
  #
  # DELIBERATELY A SHORT ALLOWLIST, which the header above rightly forbids for
  # jest. The repo has ~45 `.node.test.cjs` files listed in `npm run test:node`
  # and no workflow runs any of them; sweeping them all in here without first
  # confirming each is green would trade a silent gap for a permanently red gate.
  # This starts with the shared error taxonomy — the money-path classification —
  # and should grow file by file as each is confirmed.
  node-tests:
    name: node:test (allowlist)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` IS required, and the reason is worth writing down because it is
      # easy to get wrong locally. `node_modules` is a TRACKED SYMLINK in this
      # repo pointing at an absolute path on a developer machine, so every fresh
      # checkout — including this runner and `git archive` — starts with a
      # DANGLING link. On a dev box it silently resolves to a populated tree, so
      # "this test needs no deps" verifies as true locally and is false in CI.
      # commerce_kernel_error_body pulls in the axios/pino side of src/; only the
      # mapping test is genuinely dependency-free.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      # ADDED 2026-07-27: the three ACP feed-lane suites. Jest's testMatch is
      # `**/tests/**/*.test.(js|ts)`, so `*.node.test.cjs` is STRUCTURALLY
      # invisible to the sharded jest job below — landing them without this
      # entry would mean the only tests for the feed's flag gates, price gate and
      # rig exclusion run in no CI job at all. In a repo that has shipped "a test
      # that cannot fail" four times in three days, that is the same wound.
      # These three need only src/ + node builtins (no axios/pino side of src/),
      # which is why they are safe on the dangling-symlink checkout described
      # above; confirmed green in CI before this line was added.
      - name: Run node:test suites
        run: |
          node --test \
            tests/commerce_kernel_error_body.node.test.cjs \
            tests/commerce_kernel_error_mapping.node.test.cjs \
            tests/asserted_privilege_observation.node.test.cjs \
            tests/acp_feed_item.node.test.cjs \
            tests/acp_feed_source.node.test.cjs \
            tests/product_entity_index_feed_election.node.test.cjs

  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        # npm ci runs onnxruntime-node's postinstall, which downloads a native
        # binary from a CDN that intermittently ETIMEDOUTs and fails the whole
        # shard before any test runs. Retry a few times to ride out the flake.
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1

      - name: Run jest shard ${{ matrix.shard }}/8
        # One worker (NOT --runInBand): --workerIdleMemoryLimit recycles it
        # between files so heap can't accumulate to the OOM-abort that killed
        # --runInBand on the heaviest shard. maxWorkers=1 (not 2) gives the
        # single worker the whole runner: with 2 workers, budget-timed resolver
        # tests in aurora_bff_product_intel.test.js lost the CPU race under
        # node-20 contention and bailed to the wrong branch (green locally,
        # red in CI). Parallelism still comes from the 8-way shard matrix.
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          npx jest \
            --watchman=false \
            --silent \
            --maxWorkers=1 \
            --workerIdleMemoryLimit=768MB \
            --shard=${{ matrix.shard }}/8
