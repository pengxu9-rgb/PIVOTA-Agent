name: PDP Identity Graph Backfill

on:
  # WEEKLY CATCH-UP, added 2026-07-30. Identity minting was never wired into
  # ingestion and this workflow had no schedule, so coverage was a function of
  # who remembered to dispatch it: 8 runs, all manual, all on 2026-05-14/15,
  # while July alone ingested 3,380 mirror rows. Measured drift at the time:
  # 1,029 unsuppressed mirror rows with no identity listing, 862 of them
  # serving-eligible and therefore stuck in `shadow` forever -- the trust
  # policy cannot evaluate a row whose listing does not exist.
  #
  # The scheduled run was ALWAYS --only-uncovered, which is what makes it safe
  # to run unattended: it selects only seeds with no listing, so it never
  # reaches the writer's ON CONFLICT branch.
  #
  # The weekly schedule (cron "40 3 * * 1") moved to the Cloud Run Job
  # `pdp-identity-graph-backfill` (pivota-prod, us-west1, Cloud Scheduler
  # trigger — see pivota-backend infra/gcp/setup_scheduler.sh), pinned to the
  # same --limit 2000 --only-uncovered arguments; the result JSON lands in
  # Cloud Logging instead of a workflow artifact. This workflow's DATABASE_URL
  # secret still points at the decommissioned Railway Postgres proxy (torn down
  # 2026-08-25), so scheduled runs here could only fail (ECONNRESET on every
  # query; last success 2026-08-24). Manual dispatch is kept for ad-hoc runs
  # (brand-filtered, dry-run, or blanket applies), but requires repointing the
  # environment's DATABASE_URL secret to a reachable database first.
  workflow_dispatch:
    inputs:
      brand:
        description: "Optional brand filter"
        required: false
        default: ""
        type: string
      limit:
        description: "Rows to scan"
        required: true
        default: "500"
        type: string
      dry_run:
        description: "Dry-run only"
        required: true
        default: true
        type: boolean
      only_uncovered:
        description: "Mint ONLY for external seeds with no identity listing (safe: cannot rewrite existing rows). EXTERNAL LANE ONLY — skips products_cache."
        required: false
        default: false
        type: boolean

concurrency:
  # One production applier at a time: a manual dispatch must not overlap the cron.
  group: pdp-identity-graph-backfill
  cancel-in-progress: false

jobs:
  identity-graph-backfill:
    runs-on: ubuntu-latest
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Backfill identity graph
        shell: bash
        env:
          # Scheduled runs carry no `inputs`, so every value needs an explicit
          # default here: scan wide, apply, and uncovered-only.
          IN_LIMIT: ${{ github.event_name == 'schedule' && '2000' || inputs.limit }}
          IN_BRAND: ${{ inputs.brand }}
          IN_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
          IN_ONLY_UNCOVERED: ${{ github.event_name == 'schedule' && 'true' || inputs.only_uncovered }}
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi

          out_dir="reports/workflow_ops/pdp-identity-graph-backfill/${{ github.run_id }}"
          mkdir -p "${out_dir}"
          args=(
            --limit "${IN_LIMIT:-}"
            --out "${out_dir}/result.json"
          )
          if [[ -n "${IN_BRAND:-}" ]]; then
            args+=(--brand "${IN_BRAND:-}")
          fi
          if [[ "${IN_DRY_RUN:-true}" == "true" ]]; then
            args+=(--dry-run)
          fi
          # A blanket (non-uncovered) apply would rewrite live_read_enabled on
          # every existing listing; the scheduled path pins this to true.
          if [[ "${IN_ONLY_UNCOVERED:-true}" == "true" ]]; then
            args+=(--only-uncovered)
          fi
          node scripts/backfill-pdp-identity-graph.js "${args[@]}" \
            | tee "${out_dir}/stdout.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdp-identity-graph-backfill-${{ github.run_id }}
          path: reports/workflow_ops/pdp-identity-graph-backfill/${{ github.run_id }}
          retention-days: 7
