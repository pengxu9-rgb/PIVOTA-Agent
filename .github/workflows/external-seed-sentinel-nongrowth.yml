name: External Seed Sentinel Non-Growth Audit

# ADR-009: the merchant_id='external_seed' bucket is a retiring legacy
# population and may only shrink. This audit pages within a day if any writer
# starts refilling it — the regression class that previously went unnoticed
# for weeks (~1,693 rows minted between two censuses while the writer was
# believed fixed). Watermarks + per-lane enforce/report modes live in
# tests/fixtures/external_seed_sentinel_watermarks.json.
#
# The daily schedule (cron "23 10 * * *") moved to the Cloud Run Job
# `external-seed-sentinel-nongrowth` (pivota-prod, us-west1, Cloud Scheduler
# trigger — see pivota-backend infra/gcp/setup_scheduler.sh): a breach fails
# the execution and pages via the "prod: Cloud Run job failing" alert policy.
# This workflow's DATABASE_URL secret still points at the decommissioned
# Railway Postgres proxy (torn down 2026-08-25), so scheduled runs here could
# only fail (ECONNRESET on every query, daily since 2026-08-26). Manual
# dispatch is kept for ad-hoc audits, but requires repointing the
# environment's DATABASE_URL secret to a reachable database first.

on:
  workflow_dispatch: {}

jobs:
  sentinel-nongrowth-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run sentinel non-growth audit
        run: |
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi
          node scripts/audit-external-seed-sentinel-nongrowth.cjs
