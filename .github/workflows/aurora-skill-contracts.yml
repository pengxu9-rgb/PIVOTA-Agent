name: Aurora Skill Contracts

on:
  pull_request:
    paths:
      - "contracts/aurora_skills/**"
      - "src/auroraBff/**"
      - "tests/golden_fixtures/**"
      - "tests/skills/**"
      - "scripts/verify_aurora_contracts_sync.cjs"
      - ".github/workflows/aurora-skill-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "contracts/aurora_skills/**"
      - "src/auroraBff/**"
      - "tests/golden_fixtures/**"
      - "tests/skills/**"
      - "scripts/verify_aurora_contracts_sync.cjs"

# Superseded PR pushes cancel the run for the commit they replaced. Push-to-main
# falls through to run_id — a group of one — so every main commit keeps its own
# result, matching the concurrency shape of the other PR gates in this repo.
concurrency:
  group: aurora-skill-contracts-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  aurora-skill-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # `npm ci` retried, matching pr-full-jest.yml. This gate failed twice in ten runs on
      # 2026-09-09 with `ETIMEDOUT connect 150.171.109.74:443` — the npm registry, not this repo's
      # code. A ~20% flake on a REQUIRED gate trains people to re-run red checks without reading
      # them, which is how a real failure gets waved through.
      - name: Install
        run: |
          for attempt in 1 2 3; do
            echo "npm ci attempt $attempt/3"
            if npm ci; then exit 0; fi
            echo "npm ci failed (attempt $attempt); retrying after backoff…"
            sleep $((attempt * 15))
          done
          echo "npm ci failed after 3 attempts" >&2
          exit 1
      - run: node scripts/verify_aurora_contracts_sync.cjs
      - run: node tests/skills/test_skill_contract.js
