name: Relationship Graph Sync Routine

# The daily scheduled tick (cron "37 10 * * *") moved to the Cloud Run Job `relgraph-sync`
# (pivota-prod, us-west1, Cloud Scheduler trigger) during the Railway -> GCP migration; that lane
# also records the relationship_graph_routine_runs ledger, which this one never did. This
# workflow's DATABASE_URL secret still points at the decommissioned Railway Postgres proxy
# (torn down 2026-08-25), so scheduled runs here can only fail (ECONNRESET on every query).
# Manual dispatch/call is kept for ad-hoc ops runs, but requires repointing the environment's
# DATABASE_URL secret to a reachable database first.
on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Review cutoff timestamp, e.g. 2026-06-08T00:00:00Z. Defaults to select_hours ago."
        required: false
        default: ""
        type: string
      market:
        description: "Market code"
        required: true
        default: "US"
        type: string
      external_product_ids:
        description: "Comma/space-separated external_product_ids to sync before routine"
        required: false
        default: ""
        type: string
      affected_products_file:
        description: "Existing affected-products manifest path, if sync already ran"
        required: false
        default: ""
        type: string
      select_updated_since:
        description: "Read-only selector cutoff for changed catalog/seeds. Defaults to cutoff/select_hours ago when no explicit IDs or manifest are supplied."
        required: false
        default: ""
        type: string
      select_hours:
        description: "Default selector/review lookback window in hours"
        required: true
        default: "24"
        type: string
      select_sources:
        description: "Selector sources"
        required: true
        default: "catalog_products,external_product_seeds"
        type: string
      select_limit:
        description: "Selector row limit per source"
        required: true
        default: "250"
        type: string
      allow_empty:
        description: "Allow scheduled/manual selector windows with no changed products"
        required: true
        default: true
        type: boolean
      apply_sync:
        description: "Apply catalog sync before routine"
        required: true
        default: false
        type: boolean
      apply_build:
        description: "Apply generated relationship labels"
        required: true
        default: false
        type: boolean
      apply_review:
        description: "Apply AI approvals"
        required: true
        default: false
        type: boolean
      apply_renewal:
        description: "Apply non-LLM renewal of expiring ai_approved rows (always applied on scheduled runs)"
        required: true
        default: true
        type: boolean
      limit:
        description: "Relationship graph anchor limit"
        required: true
        default: "200"
        type: string
      review_limit:
        description: "AI review row limit"
        required: true
        default: "250"
        type: string
  workflow_call:
    inputs:
      cutoff:
        required: false
        default: ""
        type: string
      market:
        required: false
        default: "US"
        type: string
      external_product_ids:
        required: false
        default: ""
        type: string
      affected_products_file:
        required: false
        default: ""
        type: string
      select_updated_since:
        required: false
        default: ""
        type: string
      select_hours:
        required: false
        default: "24"
        type: string
      select_sources:
        required: false
        default: "catalog_products,external_product_seeds"
        type: string
      select_limit:
        required: false
        default: "250"
        type: string
      allow_empty:
        required: false
        default: true
        type: boolean
      apply_sync:
        required: false
        default: false
        type: boolean
      apply_build:
        required: false
        default: false
        type: boolean
      apply_review:
        required: false
        default: false
        type: boolean
      apply_renewal:
        required: false
        default: true
        type: boolean
      limit:
        required: false
        default: "200"
        type: string
      review_limit:
        required: false
        default: "250"
        type: string
    secrets:
      DATABASE_URL:
        required: true

concurrency:
  group: relationship-graph-sync-routine-${{ github.ref }}
  cancel-in-progress: false

jobs:
  relationship-graph-sync-routine:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      INPUT_CUTOFF: ${{ inputs.cutoff || '' }}
      INPUT_MARKET: ${{ inputs.market || 'US' }}
      INPUT_EXTERNAL_PRODUCT_IDS: ${{ inputs.external_product_ids || '' }}
      INPUT_AFFECTED_PRODUCTS_FILE: ${{ inputs.affected_products_file || '' }}
      INPUT_SELECT_UPDATED_SINCE: ${{ inputs.select_updated_since || '' }}
      INPUT_SELECT_HOURS: ${{ inputs.select_hours || '24' }}
      INPUT_SELECT_SOURCES: ${{ inputs.select_sources || 'catalog_products,external_product_seeds' }}
      INPUT_SELECT_LIMIT: ${{ inputs.select_limit || '250' }}
      INPUT_ALLOW_EMPTY: ${{ github.event_name == 'schedule' || inputs.allow_empty }}
      INPUT_APPLY_SYNC: ${{ inputs.apply_sync || false }}
      INPUT_APPLY_BUILD: ${{ inputs.apply_build || false }}
      INPUT_APPLY_REVIEW: ${{ inputs.apply_review || false }}
      INPUT_APPLY_RENEWAL: ${{ github.event_name == 'schedule' || inputs.apply_renewal }}
      INPUT_LIMIT: ${{ inputs.limit || '200' }}
      INPUT_REVIEW_LIMIT: ${{ inputs.review_limit || '250' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run guarded relationship graph routine
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${DATABASE_URL:-}" ]]; then
            echo "DATABASE_URL secret is required" >&2
            exit 1
          fi

          select_hours="${INPUT_SELECT_HOURS:-24}"
          cutoff="${INPUT_CUTOFF:-}"
          if [[ -z "${cutoff}" ]]; then
            cutoff="$(date -u -d "${select_hours} hours ago" +"%Y-%m-%dT%H:%M:%SZ")"
          fi
          select_updated_since="${INPUT_SELECT_UPDATED_SINCE:-}"
          if [[ -z "${select_updated_since}" ]]; then
            select_updated_since="${cutoff}"
          fi

          if [[ -n "${INPUT_EXTERNAL_PRODUCT_IDS}" && -n "${INPUT_AFFECTED_PRODUCTS_FILE}" ]]; then
            echo "external_product_ids and affected_products_file are mutually exclusive" >&2
            exit 1
          fi
          if [[ "${INPUT_APPLY_SYNC}" == "true" && -z "${INPUT_EXTERNAL_PRODUCT_IDS}" ]]; then
            echo "apply_sync requires explicit external_product_ids" >&2
            exit 1
          fi

          out_dir="reports/workflow_ops/relationship-graph-sync-routine/${{ github.run_id }}"
          mkdir -p "${out_dir}"

          args=(
            --cutoff "${cutoff}"
            --market "${INPUT_MARKET}"
            --out-dir "${out_dir}"
            --limit "${INPUT_LIMIT}"
            --review-limit "${INPUT_REVIEW_LIMIT}"
          )
          if [[ -n "${INPUT_EXTERNAL_PRODUCT_IDS}" ]]; then
            args+=(--external-product-ids "${INPUT_EXTERNAL_PRODUCT_IDS}")
          elif [[ -n "${INPUT_AFFECTED_PRODUCTS_FILE}" ]]; then
            args+=(--affected-products-file "${INPUT_AFFECTED_PRODUCTS_FILE}")
          else
            args+=(
              --select-updated-since "${select_updated_since}"
              --select-sources "${INPUT_SELECT_SOURCES}"
              --select-limit "${INPUT_SELECT_LIMIT}"
            )
            if [[ "${INPUT_ALLOW_EMPTY}" == "true" ]]; then
              args+=(--allow-empty-selection --allow-empty-build)
            fi
          fi
          if [[ "${INPUT_APPLY_SYNC}" == "true" ]]; then
            args+=(--apply-sync)
          fi
          if [[ "${INPUT_APPLY_BUILD}" == "true" ]]; then
            args+=(--apply-build)
          fi
          if [[ "${INPUT_APPLY_REVIEW}" == "true" ]]; then
            args+=(--apply-review)
          fi
          if [[ "${INPUT_APPLY_RENEWAL}" == "true" ]]; then
            args+=(--apply-renewal)
          fi
          if [[ "${INPUT_APPLY_SYNC}" == "true" || "${INPUT_APPLY_BUILD}" == "true" || "${INPUT_APPLY_REVIEW}" == "true" || "${INPUT_APPLY_RENEWAL}" == "true" ]]; then
            args+=(--confirm APPLY_RELGRAPH_SYNC_ROUTINE)
          fi

          npm run relgraph:sync-routine -- "${args[@]}" | tee "${out_dir}/stdout.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relationship-graph-sync-routine-${{ github.run_id }}
          path: reports/workflow_ops/relationship-graph-sync-routine/${{ github.run_id }}
          retention-days: 14
