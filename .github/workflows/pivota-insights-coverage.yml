name: Pivota Insights Coverage

on:
  workflow_dispatch:
    inputs:
      product_ids:
        description: "Comma-separated external product IDs or product refs"
        required: true
        type: string
      limit:
        description: "Case limit"
        required: true
        default: "20"
        type: string
      seed:
        description: "Run seed label"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model list"
        required: false
        default: "gemini-3-flash-preview"
        type: string
      skip_gemini:
        description: "Skip Gemini generation"
        required: true
        default: false
        type: boolean
      allow_baseline_only:
        description: "Allow baseline-only review packet rows"
        required: true
        default: false
        type: boolean
      fetch_source_facts:
        description: "Fetch source facts"
        required: true
        default: true
        type: boolean
      fetch_source_reviews:
        description: "Fetch source reviews"
        required: true
        default: false
        type: boolean

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIVOTA_BACKEND_AGENT_API_KEY: ${{ secrets.PIVOTA_BACKEND_AGENT_API_KEY }}
      SHOP_GATEWAY_AGENT_API_KEY: ${{ secrets.SHOP_GATEWAY_AGENT_API_KEY }}
      PIVOTA_AGENT_API_KEY: ${{ secrets.PIVOTA_AGENT_API_KEY }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      # AI Studio credentials are NOT declared here, deliberately. This job pins
      # VERTEX_AI_ENABLED=true below, and the transport seam
      # (src/llm/vertexGemini.js) branches purely on that flag — `restTarget()`
      # returns the Vertex arm before touching apiKey/baseUrl, and
      # `credentialsAvailable()` only inspects its apiKey argument when
      # vertexEnabled is false. So GEMINI_API_KEY / PIVOTA_GEMINI_API_KEY /
      # GOOGLE_API_KEY / GEMINI_BASE_URL / GOOGLE_GENAI_BASE_URL were
      # UNREACHABLE here, not merely unset — no value you could set would have
      # been read — and AI Studio is retired in production. Do not re-add them: a
      # credential that cannot be read is worse than absent, because it reads as
      # a working fallback that does not exist.
      #
      # Route this batch through Vertex so its usage bills the GCP project that
      # holds the credits, matching the Railway services.
      #
      # WHAT HAPPENS IF ADC IS MISSING, stated precisely because a previous
      # version of this comment got it wrong in both directions. The seam does
      # NOT silently fall back to AI Studio — every branch is gated on the flag,
      # never on credential presence, and nothing in src/ or scripts/ assigns
      # VERTEX_AI_ENABLED at runtime (only test harnesses do). But it does not
      # hard-error either: this job's actual caller,
      # scripts/product_intel_pilot_compare.js `runGeminiDraft`, checks
      # `hasGeminiKey()` and returns `{skipped:true, reason:
      # 'missing_gemini_api_key'}`, so the batch still exits 0 with a
      # GEMINI-LESS report and `gemini_skipped: N` in its meta. The
      # "Verify Vertex credentials" step below is what converts that quiet
      # degradation into a hard failure — which is exactly what its own comment
      # says it is for.
      VERTEX_AI_ENABLED: "true"
      GOOGLE_CLOUD_PROJECT: project-f165a637-145f-4de2-89d
      # NOT us-central1: gemini-3-flash-preview (this workflow's default model)
      # is 404 there and only resolves on the global endpoint.
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fail fast rather than silently producing a Gemini-less report. A prod
      # cutover was once left flag-on with a truncated credential; the guards
      # degrade cleanly, which is exactly why a bad value can go unnoticed.
      - name: Verify Vertex credentials
        if: env.VERTEX_AI_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
            echo "::error::VERTEX_AI_ENABLED=true but GOOGLE_APPLICATION_CREDENTIALS_JSON is empty."
            echo "::error::Remedy: add the Vertex service-account JSON as the repo secret GOOGLE_APPLICATION_CREDENTIALS_JSON. Its project_id must be ${GOOGLE_CLOUD_PROJECT}."
            echo "::error::It is already set on both Railway services (gateway and backend web); this is a copy into GitHub Actions secrets, not a new credential."
            echo "::error::Do NOT unset VERTEX_AI_ENABLED to 'fall back to AI Studio' — AI Studio is retired in production and no GEMINI_API_KEY/GOOGLE_API_KEY SECRET is configured for this repo, so that path would silently produce a Gemini-less report."
            exit 1
          fi
          node -e '
            const raw = process.env.GOOGLE_APPLICATION_CREDENTIALS_JSON || "";
            let d;
            try { d = JSON.parse(raw); }
            catch (e) {
              console.error(`::error::credential is not valid JSON (${raw.length} chars): ${e.message}`);
              process.exit(1);
            }
            if (d.type !== "service_account" || !d.private_key) {
              console.error("::error::credential parsed but is not a service_account key");
              process.exit(1);
            }
            // ASSERT the project, do not merely print it. The guard printed
            // project_id and checked nothing, so a service-account key from the
            // WRONG project passed here and only produced a console.error later
            // from warnOnProjectMismatch() — meaning the run bills the project
            // named in GOOGLE_CLOUD_PROJECT while quota-checking the
            // credential's. Verified safe to assert: the credential in use today
            // reports project-f165a637-145f-4de2-89d, which is the configured
            // value (run 30334494514).
            const want = String(process.env.GOOGLE_CLOUD_PROJECT || "").trim();
            if (want && d.project_id && d.project_id !== want) {
              console.error(`::error::credential belongs to project ${d.project_id} but GOOGLE_CLOUD_PROJECT is ${want}. Billing and quota would disagree; use the key for ${want}.`);
              process.exit(1);
            }
            console.log(`credential OK: ${raw.length} chars, project=${d.project_id}`);
          '

      - name: Build review packet
        shell: bash
        env:
          IN_SEED: ${{ inputs.seed }}
          IN_PRODUCT_IDS: ${{ inputs.product_ids }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          out_dir="reports/workflow_ops/pivota-insights-coverage/${{ github.run_id }}"
          mkdir -p "${out_dir}"
          seed="${IN_SEED:-}"
          if [[ -z "${seed}" ]]; then
            seed="workflow-${{ github.run_id }}"
          fi

          args=(
            --product-ids "${IN_PRODUCT_IDS:-}"
            --out-dir "${out_dir}/coverage"
            --limit "${IN_LIMIT:-}"
            --per-query "12"
            --seed "${seed}"
            --model "${IN_MODEL:-}"
            --max-per-brand "50"
            --max-per-category "50"
            --covered-review-mode "strict_human"
            --no-frontend-paths
          )
          if [[ "${{ inputs.skip_gemini }}" == "true" ]]; then
            args+=(--skip-gemini)
          fi
          if [[ "${{ inputs.allow_baseline_only }}" == "true" ]]; then
            args+=(--allow-baseline-only)
          fi
          if [[ "${{ inputs.fetch_source_facts }}" == "true" ]]; then
            args+=(--fetch-source-facts)
          else
            args+=(--no-fetch-source-facts)
          fi
          if [[ "${{ inputs.fetch_source_reviews }}" == "true" ]]; then
            args+=(--fetch-source-reviews)
          else
            args+=(--no-fetch-source-reviews)
          fi

          node scripts/pivota_insights_coverage_batch.js "${args[@]}" \
            | tee "${out_dir}/stdout.json"

          jq '.meta' "${out_dir}/coverage/review.json" > "${out_dir}/review-meta.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivota-insights-coverage-${{ github.run_id }}
          path: reports/workflow_ops/pivota-insights-coverage/${{ github.run_id }}
          retention-days: 7
