name: Pivota Insights Coverage

on:
  workflow_dispatch:
    inputs:
      product_ids:
        description: "Comma-separated external product IDs or product refs"
        required: true
        type: string
      limit:
        description: "Case limit"
        required: true
        default: "20"
        type: string
      seed:
        description: "Run seed label"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model list"
        required: false
        default: "gemini-3-flash-preview"
        type: string
      skip_gemini:
        description: "Skip Gemini generation"
        required: true
        default: false
        type: boolean
      allow_baseline_only:
        description: "Allow baseline-only review packet rows"
        required: true
        default: false
        type: boolean
      fetch_source_facts:
        description: "Fetch source facts"
        required: true
        default: true
        type: boolean
      fetch_source_reviews:
        description: "Fetch source reviews"
        required: true
        default: false
        type: boolean

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: Pivota Agent / production
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PIVOTA_BACKEND_AGENT_API_KEY: ${{ secrets.PIVOTA_BACKEND_AGENT_API_KEY }}
      SHOP_GATEWAY_AGENT_API_KEY: ${{ secrets.SHOP_GATEWAY_AGENT_API_KEY }}
      PIVOTA_AGENT_API_KEY: ${{ secrets.PIVOTA_AGENT_API_KEY }}
      AGENT_API_KEY: ${{ secrets.AGENT_API_KEY }}
      # ⚠️ THESE SECRETS DO NOT EXIST. Verified against the GitHub API on
      # 2026-07-28: this repo has 7 repo-level secrets and 1 environment-scoped
      # one, and none of the five below is among them. They render as EMPTY
      # STRINGS. Of the 11 secret names this job references, only DATABASE_URL
      # is actually set.
      #
      # So there is nothing to revoke here, and deleting these lines is a
      # documentation fix rather than a security one. Left in place because
      # removing them is not this PR's job (it is a security fix, and a
      # behaviour-neutral cleanup would only blur what it changed) — but do not
      # read this block as evidence that credentials are exposed. They are not.
      #
      # A live secret elsewhere is a different matter, and the ordering there
      # still holds: revoke at the provider -> delete the repo secret -> then
      # remove the reference, at which point removal is provably a no-op.
      #
      # NOTE ALSO: with GOOGLE_APPLICATION_CREDENTIALS_JSON unset, the
      # "Verify Vertex credentials" step above hard-fails (exit 1) before this
      # job reaches any of the steps below. That guard landed 2026-07-21 and the
      # workflow has had 0 runs since, so it has never executed in this form.
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PIVOTA_GEMINI_API_KEY: ${{ secrets.PIVOTA_GEMINI_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL }}
      GOOGLE_GENAI_BASE_URL: ${{ secrets.GOOGLE_GENAI_BASE_URL }}
      # Route this batch through Vertex so its usage bills the GCP project that
      # holds the credits, matching the Railway services. Without these the seam
      # silently falls back to AI Studio and the spend lands on the old API key.
      VERTEX_AI_ENABLED: "true"
      GOOGLE_CLOUD_PROJECT: project-f165a637-145f-4de2-89d
      # NOT us-central1: gemini-3-flash-preview (this workflow's default model)
      # is 404 there and only resolves on the global endpoint.
      GOOGLE_CLOUD_LOCATION: global
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fail fast rather than silently producing a Gemini-less report. A prod
      # cutover was once left flag-on with a truncated credential; the guards
      # degrade cleanly, which is exactly why a bad value can go unnoticed.
      - name: Verify Vertex credentials
        if: env.VERTEX_AI_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GOOGLE_APPLICATION_CREDENTIALS_JSON:-}" ]]; then
            echo "::error::VERTEX_AI_ENABLED=true but GOOGLE_APPLICATION_CREDENTIALS_JSON is empty."
            echo "::error::Add the service-account JSON as a repo secret, or unset VERTEX_AI_ENABLED to use AI Studio."
            exit 1
          fi
          node -e '
            const raw = process.env.GOOGLE_APPLICATION_CREDENTIALS_JSON || "";
            let d;
            try { d = JSON.parse(raw); }
            catch (e) {
              console.error(`::error::credential is not valid JSON (${raw.length} chars): ${e.message}`);
              process.exit(1);
            }
            if (d.type !== "service_account" || !d.private_key) {
              console.error("::error::credential parsed but is not a service_account key");
              process.exit(1);
            }
            console.log(`credential OK: ${raw.length} chars, project=${d.project_id}`);
          '

      - name: Build review packet
        shell: bash
        env:
          IN_SEED: ${{ inputs.seed }}
          IN_PRODUCT_IDS: ${{ inputs.product_ids }}
          IN_LIMIT: ${{ inputs.limit }}
          IN_MODEL: ${{ inputs.model }}
        run: |
          set -euo pipefail
          out_dir="reports/workflow_ops/pivota-insights-coverage/${{ github.run_id }}"
          mkdir -p "${out_dir}"
          seed="${IN_SEED:-}"
          if [[ -z "${seed}" ]]; then
            seed="workflow-${{ github.run_id }}"
          fi

          args=(
            --product-ids "${IN_PRODUCT_IDS:-}"
            --out-dir "${out_dir}/coverage"
            --limit "${IN_LIMIT:-}"
            --per-query "12"
            --seed "${seed}"
            --model "${IN_MODEL:-}"
            --max-per-brand "50"
            --max-per-category "50"
            --covered-review-mode "strict_human"
            --no-frontend-paths
          )
          if [[ "${{ inputs.skip_gemini }}" == "true" ]]; then
            args+=(--skip-gemini)
          fi
          if [[ "${{ inputs.allow_baseline_only }}" == "true" ]]; then
            args+=(--allow-baseline-only)
          fi
          if [[ "${{ inputs.fetch_source_facts }}" == "true" ]]; then
            args+=(--fetch-source-facts)
          else
            args+=(--no-fetch-source-facts)
          fi
          if [[ "${{ inputs.fetch_source_reviews }}" == "true" ]]; then
            args+=(--fetch-source-reviews)
          else
            args+=(--no-fetch-source-reviews)
          fi

          node scripts/pivota_insights_coverage_batch.js "${args[@]}" \
            | tee "${out_dir}/stdout.json"

          jq '.meta' "${out_dir}/coverage/review.json" > "${out_dir}/review-meta.json"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pivota-insights-coverage-${{ github.run_id }}
          path: reports/workflow_ops/pivota-insights-coverage/${{ github.run_id }}
          retention-days: 7
