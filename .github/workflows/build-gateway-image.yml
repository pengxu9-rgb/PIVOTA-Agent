# Build and push gateway:<sha> on every push to main. BUILD ONLY: it deploys nothing.
#
# The gateway service still never deploys on merge (pivota-backend infra/gcp/deploy_gateway.sh is
# the deploy). What this removes is the hand BUILD: every Cloud Run Job on the gateway image
# (relgraph-sync, relgraph-health, the seed sentinel, ...) is re-imaged with
# `pivota-backend infra/gcp/reimage_jobs.sh prod gateway <sha>`, which refuses a sha with no image,
# and until now that image existed only if someone had run
# `gcloud builds submit --config infra/gcp/cloudbuild.gateway.yaml` from a laptop checkout.
#
# Same image as that hand build (the root Dockerfile, `--build-arg COMMIT_SHA=<sha>`, which stamps
# /app/.image_commit_sha), tagged `:<sha>` ONLY and pushed to a repository of its own:
# us-west1-docker.pkg.dev/pivota-shared/pivota-gateway/gateway. That repository has IMMUTABLE tags,
# so a pushed sha can never be re-pointed, and so it has no `:latest` (nothing deploys one). This
# identity may write nowhere else, in particular not to `pivota`, where `backend:latest` runs in prod.
# pivota-backend's scripts resolve a gateway sha in pivota-gateway first, then in `pivota` (hand builds).
#
# DARK UNTIL ARMED. The job is skipped unless the repository variable GATEWAY_IMAGE_BUILD_ENABLED is
# `true`. The identity it authenticates as (provider github-gateway, pinned to THIS workflow file on
# main; sa-gateway-image-build, which may push to `pivota-gateway` and do nothing else) is created by
# pivota-backend infra/gcp/setup_gateway_image_build_identity.sh; set the variable after that has
# run, or every push would fail at the auth step.
name: Build gateway image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # mints the OIDC token Workload Identity Federation exchanges

# One build per commit; a newer push does not cancel an older one (each sha needs its own image).
concurrency:
  group: build-gateway-image-${{ github.sha }}
  cancel-in-progress: false

env:
  REGION: us-west1
  IMAGE: us-west1-docker.pkg.dev/pivota-shared/pivota-gateway/gateway

jobs:
  build:
    if: ${{ vars.GATEWAY_IMAGE_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions pinned to commit SHAs (the tag they were resolved from is in the comment): this job
      # holds a registry-write token, so its dependencies must not move under it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The provider's attribute condition already pins refs/heads/main; this check is the
      # readable error for a workflow_dispatch from another branch, not the security boundary.
      - name: Verify the commit is on main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_SHA} is not on main"; exit 1; }

      - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
        with:
          workload_identity_provider: projects/371394967380/locations/global/workloadIdentityPools/github-actions/providers/github-gateway
          service_account: sa-gateway-image-build@pivota-shared.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2

      # A sha is a commit: an image already pushed for it (a re-run) is kept as-is. The repository's
      # immutable tags would refuse an overwrite anyway; this makes a re-run green instead of red.
      - name: Build and push
        run: |
          if gcloud artifacts docker images describe "${IMAGE}:${GITHUB_SHA}" >/dev/null 2>&1; then
            echo "${IMAGE}:${GITHUB_SHA} already exists; keeping it"; exit 0
          fi
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --build-arg "COMMIT_SHA=${GITHUB_SHA}" -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"
          echo "pushed ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
