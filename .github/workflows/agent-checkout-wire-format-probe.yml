name: Agent Checkout Wire-Format Probe

# MANUAL probe (workflow_dispatch only) that confirms the money-unit conventions the Safety Kernel depends
# on, by running scripts/probe_wire_format.mjs against the LIVE gateway using credentials from CI secrets.
#
# Runs ONLY the non-charge phases:
#   Phase 1 read-only : find_products + preview_quote
#   Phase 2 write     : + create_order  (no money; leaves an unpaid order draft)  [toggle: run_create_order]
#
# It NEVER fires a charge: --charge is never passed and PROBE_ALLOW_CHARGE is never set. The charge phase
# (Phase 3) + the Stripe-dashboard ground-truth check MUST be run by a human per
# docs/agent-checkout/PROBE_RUNBOOK.md — it moves real money and needs test-mode + dashboard verification.
#
# CREDENTIALS: by default this uses PROBE_BASE from repo variables/secrets, then falls back to the
# production gateway origin. Auth reuses PROBE_KEY, or the same secret the existing prod smoke gate
# uses (COMMERCE_CORE_PROD_AUTH_TOKEN, sent as Authorization: Bearer — see
# scripts/verify_deployed_commit_matches.sh AUTH_MODE=bearer). No new secrets required.
# Override with the base_url input, or set a PROBE_KEY secret to use a different token.
# Output (redacted by the script) goes to the job summary + an uploaded artifact.

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Gateway origin serving /agent/shop/v1/invoke. Leave blank to use PROBE_BASE repo var/secret."
        type: string
        default: ""
      run_wire_format_probe:
        description: "Run the normal wire-format probe. Disable when probing strict fail-closed identity without a verified user token."
        type: boolean
        default: true
      run_create_order:
        description: "Run Phase 2 create_order (a backend WRITE; creates an unpaid order draft; no charge)"
        type: boolean
        default: true
      run_strict_identity_gate:
        description: "Run no-charge strict-mode identity gate: money op with only PROBE_KEY must fail USER_AUTH_REQUIRED"
        type: boolean
        default: false
      run_strict_create_order_canary:
        description: "Run no-charge strict Safety Kernel preview_quote + create_order canary. Requires target AGENT_CHECKOUT_ALLOW_TEST_IDENTITY=1."
        type: boolean
        default: false
      strict_user_ref:
        description: "Optional strict canary user_ref. Defaults to a GitHub run-scoped synthetic test identity."
        type: string
        default: ""
      strict_acp_session_id:
        description: "Optional strict canary acp_session_id. Defaults to a GitHub run-scoped synthetic test session."
        type: string
        default: ""
      product_id:
        description: "Optional: pin PROBE_PRODUCT_ID (prefer a cents-priced item, e.g. $0.99)"
        type: string
        default: ""
      merchant_id:
        description: "Optional: pin PROBE_MERCHANT_ID"
        type: string
        default: ""
      variant_id:
        description: "Optional: pin PROBE_VARIANT_ID"
        type: string
        default: ""
      query:
        description: "Optional: product search query (used only if no product is pinned)"
        type: string
        default: ""
      currency:
        description: "Currency code"
        type: string
        default: "USD"
      auth_header:
        description: "Auth header NAME (not a secret). Default Authorization (Bearer); set e.g. X-API-Key if needed."
        type: string
        default: "Authorization"

permissions:
  contents: read

concurrency:
  group: wire-format-probe
  cancel-in-progress: false

jobs:
  probe:
    if: ${{ inputs.run_wire_format_probe }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight — credentials present
        env:
          PROBE_BASE: ${{ inputs.base_url || vars.PROBE_BASE || secrets.PROBE_BASE || 'https://pivota-agent-production.up.railway.app' }}
          PROBE_KEY: ${{ secrets.PROBE_KEY || secrets.COMMERCE_CORE_PROD_AUTH_TOKEN }}
        run: |
          if [ -z "$PROBE_BASE" ]; then
            echo "::error::base_url input is empty."
            exit 1
          fi
          if [ -z "$PROBE_KEY" ]; then
            echo "::error::No token available. Set a PROBE_KEY secret, or ensure COMMERCE_CORE_PROD_AUTH_TOKEN exists."
            exit 1
          fi
          echo "Credentials present. Backend will be probed (host/token hidden)."

      - name: "Run probe${{ inputs.run_create_order && ' (read-only + create_order)' || ' (read-only)' }}"
        env:
          PROBE_BASE: ${{ inputs.base_url || vars.PROBE_BASE || secrets.PROBE_BASE || 'https://pivota-agent-production.up.railway.app' }}
          PROBE_KEY: ${{ secrets.PROBE_KEY || secrets.COMMERCE_CORE_PROD_AUTH_TOKEN }}
          PROBE_AUTH_HEADER: ${{ inputs.auth_header }}
          PROBE_PRODUCT_ID: ${{ inputs.product_id }}
          PROBE_MERCHANT_ID: ${{ inputs.merchant_id }}
          PROBE_VARIANT_ID: ${{ inputs.variant_id }}
          PROBE_QUERY: ${{ inputs.query }}
          PROBE_CURRENCY: ${{ inputs.currency }}
        run: |
          set -o pipefail
          FLAGS="--json"
          if [ "${{ inputs.run_create_order }}" = "true" ]; then
            FLAGS="--create-order $FLAGS"
          fi
          echo "Running: node scripts/probe_wire_format.mjs $FLAGS"
          node scripts/probe_wire_format.mjs $FLAGS 2>&1 | tee probe-output.txt

      - name: Publish verdict to job summary
        if: always()
        run: |
          {
            echo "## Wire-format probe results";
            echo "";
            echo '```';
            # The script output is already redacted. On success, surface the results block; on failure
            # (e.g. auth/connection error) surface the tail so the error is visible.
            if grep -q '^Results to send back' probe-output.txt 2>/dev/null; then
              sed -n '/^Results to send back/,/^What this means for our code:/p' probe-output.txt;
            else
              echo "Probe did not reach a verdict — last lines:";
              tail -n 40 probe-output.txt 2>/dev/null || echo "(no output captured)";
            fi
            echo '```';
            echo "";
            echo "_Charge phase (Phase 3) + Stripe dashboard check were NOT run — do them manually per docs/agent-checkout/PROBE_RUNBOOK.md._";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe output (redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wire-format-probe-output
          path: probe-output.txt
          if-no-files-found: warn

  strict-identity-gate:
    name: Strict Identity Gate
    if: ${{ inputs.run_strict_identity_gate }}
    runs-on: ubuntu-latest
    steps:
      - name: Assert strict money op fails without verified user/session
        env:
          PROBE_BASE: ${{ inputs.base_url || vars.PROBE_IDENTITY_BASE || vars.PIVOTA_AGENT_STAGING_BASE_URL || 'https://pivota-agent-staging.up.railway.app' }}
          PROBE_KEY: ${{ secrets.PROBE_KEY || secrets.COMMERCE_CORE_PROD_AUTH_TOKEN }}
          PROBE_AUTH_HEADER: ${{ inputs.auth_header }}
        run: |
          set -euo pipefail

          if [ -z "$PROBE_BASE" ]; then
            echo "::error::No gateway origin available. Set the base_url input or PROBE_BASE repo variable/secret."
            exit 1
          fi
          if [ -z "$PROBE_KEY" ]; then
            echo "::error::No token available. Set a PROBE_KEY secret, or ensure COMMERCE_CORE_PROD_AUTH_TOKEN exists."
            exit 1
          fi

          AUTH_VALUE="$PROBE_KEY"
          if [ "$(printf '%s' "$PROBE_AUTH_HEADER" | tr '[:upper:]' '[:lower:]')" = "authorization" ]; then
            case "$AUTH_VALUE" in
              Bearer\ *|ApiKey\ *|Basic\ *) ;;
              *) AUTH_VALUE="Bearer $AUTH_VALUE" ;;
            esac
          fi

          STATUS="$(curl -sS -o identity-response.json -w '%{http_code}' \
            -X POST "$PROBE_BASE/agent/shop/v1/invoke" \
            -H "$PROBE_AUTH_HEADER: $AUTH_VALUE" \
            -H "Content-Type: application/json" \
            --data '{"operation":"preview_quote","payload":{"quote":{"merchant_id":"probe-merchant","items":[{"product_id":"probe-product","quantity":1}],"shipping_address":{"country":"US","postal_code":"94102","city":"SF"}}}}')"

          echo "HTTP status: $STATUS"
          node - "$STATUS" <<'NODE'
          const fs = require("fs");
          const status = process.argv[2];
          const raw = fs.readFileSync("identity-response.json", "utf8");
          let body = {};
          try {
            body = raw ? JSON.parse(raw) : {};
          } catch (err) {
            console.error("Response was not JSON:", raw.slice(0, 500));
            process.exit(1);
          }

          const code = body.code || body.error?.code || "";
          const message = body.message || body.error?.message || "";
          if (status !== "401" || code !== "USER_AUTH_REQUIRED") {
            console.error("Strict identity gate failed.");
            console.error(JSON.stringify({ status, code, message }, null, 2));
            process.exit(1);
          }

          fs.appendFileSync(
            process.env.GITHUB_STEP_SUMMARY,
            [
              "## Strict identity gate",
              "",
              "Passed: strict quote operation with only the platform probe key failed before checkout execution.",
              "",
              `- HTTP status: ${status}`,
              `- Code: ${code}`,
              ""
            ].join("\n")
          );
          console.log(JSON.stringify({ status, code }, null, 2));
          NODE

  strict-create-order-canary:
    name: Strict Create-Order Canary
    if: ${{ inputs.run_strict_create_order_canary }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Preflight strict create-order canary
        env:
          PROBE_BASE: ${{ inputs.base_url || vars.PROBE_BASE || secrets.PROBE_BASE || 'https://pivota-agent-production.up.railway.app' }}
          PROBE_KEY: ${{ secrets.PROBE_KEY || secrets.COMMERCE_CORE_PROD_AUTH_TOKEN }}
          PROBE_PRODUCT_ID: ${{ inputs.product_id || vars.PROBE_PRODUCT_ID }}
          PROBE_MERCHANT_ID: ${{ inputs.merchant_id || vars.PROBE_MERCHANT_ID }}
          PROBE_QUERY: ${{ inputs.query }}
        run: |
          set -euo pipefail
          if [ -z "$PROBE_BASE" ]; then
            echo "::error::No gateway origin available. Set base_url or PROBE_BASE."
            exit 1
          fi
          if [ -z "$PROBE_KEY" ]; then
            echo "::error::No token available. Set PROBE_KEY or COMMERCE_CORE_PROD_AUTH_TOKEN."
            exit 1
          fi
          if [ -z "$PROBE_PRODUCT_ID" ] || [ -z "$PROBE_MERCHANT_ID" ]; then
            echo "No strict canary product pins supplied; the script will auto-select from find_products using PROBE_QUERY='${PROBE_QUERY:-cheap test item}'."
          else
            echo "Strict canary will use pinned product/merchant inputs."
          fi
          echo "Strict create-order canary preflight passed. Target/token/product values are hidden."

      - name: Run strict create-order canary
        env:
          PROBE_BASE: ${{ inputs.base_url || vars.PROBE_BASE || secrets.PROBE_BASE || 'https://pivota-agent-production.up.railway.app' }}
          PROBE_KEY: ${{ secrets.PROBE_KEY || secrets.COMMERCE_CORE_PROD_AUTH_TOKEN }}
          PROBE_AUTH_HEADER: ${{ inputs.auth_header }}
          PROBE_PRODUCT_ID: ${{ inputs.product_id || vars.PROBE_PRODUCT_ID }}
          PROBE_MERCHANT_ID: ${{ inputs.merchant_id || vars.PROBE_MERCHANT_ID }}
          PROBE_VARIANT_ID: ${{ inputs.variant_id || vars.PROBE_VARIANT_ID }}
          PROBE_QUERY: ${{ inputs.query }}
          PROBE_CURRENCY: ${{ inputs.currency }}
          STRICT_CANARY_SEND_TEST_IDENTITY: "1"
          STRICT_CANARY_USER_REF: ${{ inputs.strict_user_ref || format('usr_gh_strict_{0}', github.run_id) }}
          STRICT_CANARY_ACP_SESSION_ID: ${{ inputs.strict_acp_session_id || format('acp_gh_strict_{0}_{1}', github.run_id, github.run_attempt) }}
          STRICT_CANARY_ALLOW_CREATE_ORDER: "1"
        run: |
          set -o pipefail
          echo "Running strict no-charge canary: node scripts/probe_strict_checkout_canary.mjs --create-order --json"
          node scripts/probe_strict_checkout_canary.mjs --create-order --json 2>&1 | tee strict-canary-output.txt

      - name: Publish strict canary verdict to job summary
        if: always()
        run: |
          {
            echo "## Strict create-order canary results";
            echo "";
            echo '```json';
            if [ -s strict-canary-output.txt ]; then
              cat strict-canary-output.txt;
            else
              echo '{"status":"no_output"}';
            fi
            echo '```';
            echo "";
            echo "_No charge was attempted: this job never passes --charge and never sets charge acknowledgment env vars._";
            echo "_Target gateway must have AGENT_CHECKOUT_ALLOW_TEST_IDENTITY=1 only for the controlled canary window._";
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload strict canary output (redacted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-create-order-canary-output
          path: strict-canary-output.txt
          if-no-files-found: warn
